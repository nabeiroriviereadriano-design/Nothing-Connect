name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core-linux:
    name: Cœur Rust (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Débit (release)
        run: cargo test --release -p nc-core --test e2e -- throughput --nocapture

  windows:
    name: Application Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/windows/package-lock.json }
      - name: Tests du cœur sous Windows (réseau, chemins, fichiers)
        run: cargo test
      - name: Interface
        working-directory: apps/windows
        run: |
          npm ci
          npm run check
          npm run build
      - name: Compilation de l'application
        run: cargo build --release -p nothing-connect-windows

  android:
    name: Application Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: NDK (préinstallé sur le runner)
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: cargo install cargo-ndk --locked
      - run: ./scripts/build-android-native.sh release
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Compilation APK
        working-directory: apps/android
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build.log || {
            # Erreurs Kotlin remontées en annotations lisibles dans l'onglet Actions.
            grep -E "^e: " build.log | head -50 | while read -r l; do echo "::error::$l"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: nothing-connect-android-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
