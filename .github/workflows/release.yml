name: Publication

# Publier une version :  git tag v0.1.0 && git push origin v0.1.0
# Le numéro du tag doit correspondre à apps/windows/package.json (scripts/set-version.py).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./apps/windows/package.json').version")
          CARGO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CARGO" ]; then
            echo "::error::Tag $TAG, package.json $PKG, Cargo.toml $CARGO : versions différentes"; exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/windows/package-lock.json }
      - run: cargo test
      - working-directory: apps/windows
        run: npm ci
      # Construit l'installeur NSIS (avec désinstalleur), le signe pour l'outil de mise à jour,
      # crée la Release GitHub et publie latest.json (lu par les applications installées).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/windows
          tagName: v__VERSION__
          releaseName: NOTHING CONNECT v__VERSION__
          releaseBody: "Voir CHANGELOG.md. Windows : installez le fichier -setup.exe. Android : installez le fichier .apk."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  android:
    needs: [check-version, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: NDK (préinstallé sur le runner)
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: cargo install cargo-ndk --locked
      - run: ./scripts/build-android-native.sh release
      - name: "Clé de signature (la même à chaque version, indispensable aux mises à jour)"
        working-directory: apps/android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant"; exit 1; fi
          echo "$KS" | base64 -d > release.jks
          cat > keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - working-directory: apps/android
        run: gradle assembleRelease
      - name: Fichiers de la version
        run: |
          V=${{ needs.check-version.outputs.version }}
          mkdir out
          cp apps/android/app/build/outputs/apk/release/app-release.apk "out/NOTHING-CONNECT-$V.apk"
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" out/* --clobber
