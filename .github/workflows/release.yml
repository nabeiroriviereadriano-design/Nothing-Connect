name: Publication

# Publier une version : fixer le numéro (scripts/set-version.py X.Y.Z), le pousser sur main,
# puis pousser main sur la branche « release » (git push origin main:release) ou lancer ce
# workflow depuis l'onglet Actions. Le tag vX.Y.Z et la Release sont créés automatiquement.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG=$(node -p "require('./apps/windows/package.json').version")
          CARGO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$PKG" != "$CARGO" ]; then
            echo "::error::package.json $PKG et Cargo.toml $CARGO différents (scripts/set-version.py)"; exit 1
          fi
          if gh release view "v$PKG" >/dev/null 2>&1; then
            echo "::error::La version $PKG est déjà publiée : augmentez le numéro avec scripts/set-version.py"; exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

  windows:
    needs: check-version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Assembleur pour les routines optimisées de l'encodeur H.264 (OpenH264).
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/windows/package-lock.json }
      - run: cargo test
      - working-directory: apps/windows
        run: npm ci
      - name: Pilote d'écran étendu (embarqué dans l'installeur)
        shell: pwsh
        run: ./native/windows/display-driver/build-driver.ps1
      # Construit l'installeur NSIS (avec désinstalleur), le signe pour l'outil de mise à jour,
      # crée la Release GitHub et publie latest.json (lu par les applications installées).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/windows
          tagName: v__VERSION__
          releaseName: NOTHING CONNECT v__VERSION__
          releaseBody: "Voir CHANGELOG.md. Windows : installez le fichier -setup.exe. Android : installez le fichier .apk."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  android:
    needs: [check-version, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: NDK (préinstallé sur le runner)
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: cargo install cargo-ndk --locked
      - run: ./scripts/build-android-native.sh release
      - name: "Clé de signature (la même à chaque version, indispensable aux mises à jour)"
        working-directory: apps/android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant"; exit 1; fi
          echo "$KS" | base64 -d > release.jks
          cat > keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - working-directory: apps/android
        run: gradle assembleRelease
      - name: Fichiers de la version
        run: |
          V=${{ needs.check-version.outputs.version }}
          mkdir out
          cp apps/android/app/build/outputs/apk/release/app-release.apk "out/NOTHING-CONNECT-$V.apk"
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.check-version.outputs.version }}" out/* --clobber
