[package]
name = "nothing-connect-windows"
description = "Application Windows NOTHING CONNECT"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nc_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
nc-core = { workspace = true, features = ["mdns"] }
nc-security = { workspace = true, features = ["os-keyring"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
dirs = "6"
cpal = "0.18"
ureq = "2.12"
jpeg-encoder = { version = "0.7", features = ["simd"] }
# Encodage H.264 de l'écran étendu (compilé depuis les sources ; assembleur si nasm est présent).
openh264 = "0.9"
sha2.workspace = true
hex.workspace = true
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_System_DataExchange",
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Pointer",
  "Win32_System_Com",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Devices_Bluetooth_Advertisement",
  "Storage_Streams",
  "Foundation",
  "Foundation_Collections",
] }
